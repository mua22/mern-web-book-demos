<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5.10 Working with Forms Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Sign Up</h1>
  <p>This form is validated entirely in JavaScript. There is no server -- submitting just checks the fields and reports the result on this page.</p>

  <form id="signup-form" novalidate>
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name">
      <p class="error" id="name-error"></p>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email">
      <p class="error" id="email-error"></p>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password">
      <p class="error" id="password-error"></p>
    </div>

    <button type="submit">Create Account</button>

    <p class="success" id="success-message"></p>
  </form>

  <script src="script.js" defer></script>
</body>
</html>
