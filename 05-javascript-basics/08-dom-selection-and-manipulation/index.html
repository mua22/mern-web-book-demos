<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5.8 DOM Selection &amp; Manipulation Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Shopping List</h1>
  <p>Add items to the list. Click an item's text to mark it done. Click "Remove" to delete just that item.</p>

  <div class="add-row">
    <input type="text" id="item-input" placeholder="e.g. Milk">
    <button id="add-btn">Add</button>
  </div>

  <p id="item-count">0 items</p>

  <ul id="item-list"></ul>

  <script src="script.js" defer></script>
</body>
</html>
