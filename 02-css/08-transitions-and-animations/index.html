<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transitions and Animations Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Transitions and Animations</h1>
  <p class="intro">
    Hover over the button to see a smooth transition. The spinner and badge below animate
    on their own, in an endless loop, using <code>@keyframes</code>.
  </p>

  <section>
    <h2>Transition on Hover</h2>
    <button class="hover-button">Hover Over Me</button>
  </section>

  <section>
    <h2>Looping Keyframe Animation: Spinner</h2>
    <div class="spinner"></div>
  </section>

  <section>
    <h2>Looping Keyframe Animation: Pulsing Badge</h2>
    <span class="badge">New</span>
  </section>
</body>
</html>
