<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5.4 Functions</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; max-width: 640px; margin: 40px auto; line-height: 1.5; color: #222; }
  label { display: inline-block; width: 70px; }
  input { width: 80px; padding: 4px; margin-bottom: 8px; }
  button { padding: 6px 14px; margin: 4px 6px 4px 0; }
  #result { font-size: 1.2rem; font-weight: bold; margin-top: 16px; padding: 10px; border: 1px solid #ccc; }
</style>
<script src="script.js" defer></script>
</head>
<body>

  <h1>5.4: Functions</h1>

  <p>A tiny calculator. Enter two numbers, then click an operation. Each operation below is
    written in a different function style - see <code>script.js</code> and README.md.</p>

  <div>
    <label for="input-a">Value A</label>
    <input type="number" id="input-a" value="10">
  </div>
  <div>
    <label for="input-b">Value B</label>
    <input type="number" id="input-b" value="4">
  </div>

  <div>
    <button id="btn-add">Add (function declaration)</button>
    <button id="btn-subtract">Subtract (function expression)</button>
    <button id="btn-multiply">Multiply (arrow function)</button>
    <button id="btn-divide">Divide (arrow, default parameter)</button>
  </div>

  <p id="result">(No calculation yet.)</p>

</body>
</html>
